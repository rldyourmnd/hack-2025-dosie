name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@b5284b8a63b81c3bfec197d18ff8725616b12a25 # v0.6.65
    permissions:
      contents: read
    with:
      hosted-runner: ubuntu-26.04
      fetch-depth: 0
      tools: zizmor@1.32.0
      tool-assets: .github/source-tools.json

  workflows:
    name: workflows
    if: always()
    needs: [check]
    runs-on: ubuntu-26.04
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Require the complete shared source check
        env:
          SOURCE_RESULT: ${{ needs.check.result }}
        run: test "$SOURCE_RESULT" = success
